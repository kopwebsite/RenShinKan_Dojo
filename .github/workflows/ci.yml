name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean dependency installation
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Configuration and archive boundaries
        run: npm run config:check && npm run archive:check
      - name: Formatting
        run: npm run format:check
      - name: Lint and TypeScript
        run: npm run lint && npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Empty replay and previous-schema upgrade
        run: npm run test:migrations
      - name: Production build
        run: npm run build
      - name: Performance bundle budgets
        run: npm run perf:budget
      - name: Install release browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Runtime smoke and axe accessibility tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
