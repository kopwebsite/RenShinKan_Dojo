"$schema" = "./node_modules/wrangler/config-schema.json"
name = "renshinkan-dojo"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-01"

[vars]
SITE_URL = "https://renshinkandojo.org"
ALLOWED_ORIGIN = "https://renshinkandojo.org"
VITE_SITE_URL = "https://renshinkandojo.org"
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAADcmYAchez5JIG6l"

[[kv_namespaces]]
binding = "CONTENT_KV"
# KV namespace: renshinkan-content
# Production and preview currently point at the same namespace. To separate
# them later, run `npx wrangler kv namespace create CONTENT_KV --preview`
# and replace preview_id with the new id it prints.
id = "6ab67d96ab894636bd7b7ef2fa97b7e2"
preview_id = "6ab67d96ab894636bd7b7ef2fa97b7e2"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "renshinkan-dojo-media"
preview_bucket_name = "renshinkan-dojo-media-preview"

[[d1_databases]]
binding = "STUDENT_DB"
database_name = "renshinkan-student-records"
database_id = "dbba70a8-1776-44ba-b455-f2576b3518bf"
preview_database_id = "dbba70a8-1776-44ba-b455-f2576b3518bf"
migrations_dir = "migrations"
